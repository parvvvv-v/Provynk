/* ---------- PDF reading (layout-aware) ---------- */
async function taPdfRead(bytes) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const d = await pdfjsLib.getDocument({ data: bytes }).promise, lines = [], links = [];
  for (let p = 1; p <= d.numPages; p++) {
    const pg = await d.getPage(p), tc = await pg.getTextContent(), W = pg.view[2] - pg.view[0];
    /* 1) group text items into rows by baseline, 2) merge nearby items into segments */
    const rows = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = it.transform[5], x = it.transform[4], h = Math.abs(it.transform[3]) || it.height || 10;
      let r = rows.find(r => Math.abs(r.y - y) <= Math.max(2, h * .35)); if (!r) { r = { y, items: [], size: 0 }; rows.push(r); }
      r.items.push({ x, w: it.width || 0, s: it.str }); r.size = Math.max(r.size, h);
    }
    const segs = [];
    rows.forEach(r => {
      r.items.sort((a, b) => a.x - b.x); let cur = null;
      r.items.forEach(it => {
        if (cur && it.x - cur.x1 <= Math.max(14, r.size * 1.4)) { cur.s += (it.x - cur.x1 > 1.2 && !cur.s.endsWith(" ") ? " " : "") + it.s; cur.x1 = it.x + it.w; }
        else { cur = { y: r.y, x0: it.x, x1: it.x + it.w, s: it.s, size: r.size }; segs.push(cur); }
      });
    });
    /* detect a two-column layout: a vertical gutter that (almost) no segment crosses */
    let gut = null;
    if (segs.length > 14) {
      for (let g = W * .22; g <= W * .78; g += 4) {
        const cross = segs.filter(s => s.x0 < g - 2 && s.x1 > g + 2).length, L = segs.filter(s => s.x1 <= g + 2).length, R = segs.filter(s => s.x0 >= g - 2).length;
        if (cross <= segs.length * .06 && L >= segs.length * .2 && R >= segs.length * .2) { gut = g; break; }
      }
    }
    const emit = arr => { arr.sort((a, b) => Math.abs(a.y - b.y) > 2 ? b.y - a.y : a.x0 - b.x0); let last = null; arr.forEach(s => { const t = s.s.replace(/\s+/g, " ").trim(); if (!t) return; if (last && Math.abs(last.y - s.y) <= 2 && gut == null) last.t += "  " + t; else { last = { t, size: s.size, page: p, y: s.y }; lines.push(last); } }); };
    if (gut != null) { emit(segs.filter(s => s.x0 < gut)); emit(segs.filter(s => s.x0 >= gut)); } else emit(segs);
    try { for (const an of await pg.getAnnotations()) if (an.url) links.push(an.url); } catch { }
  }
  return { lines: lines.map(l => ({ t: l.t, size: l.size, page: l.page })), links, pages: d.numPages };
}

/* scroll-reveal helper (adds .sv-r, then .sv-on when the element enters the screen) */
window.revealFx = (sel, step = .08) => {
  const els = [...document.querySelectorAll(sel)];
  if (!("IntersectionObserver" in window)) return els.forEach(e => e.classList.add("sv-on"));
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const t = e.target; t.classList.add("sv-on"); io.unobserve(t); setTimeout(() => t.style.transitionDelay = "", 1500); } }), { threshold: .15 });
  els.forEach((el, i) => { el.classList.add("sv-r"); if (step) el.style.transitionDelay = (i % 3) * step + "s"; io.observe(el); });
};

    <div class="sv-hi"><p class="sv-eb">Services</p><h2>Everything you need to build an <b>enterprise tech team</b></h2>
      <p class="sv-sub">From a single SAP specialist to a full delivery squad, one network covers sourcing, screening and shortlisting.</p>
      <div class="sv-chips"><span>Sourcing</span><span>Screening</span><span>Shortlisting</span></div></div></div>
  <div class="sv-list">${SERVICES.map(([t, d, b, k, im], i) => `<div class="sv-row"><div class="sv-img"><div class="sv-ph"><img src="https://images.unsplash.com/${im}?auto=format&fit=crop&w=900&q=65" alt="" loading="lazy" onerror="this.remove()"></div><span class="sv-num">0${i + 1}</span></div>
    <div class="sv-txt"><p class="sv-k">Service 0${i + 1}</p><h3>${t}</h3><span class="sv-bar"></span><p class="mut">${d}</p><button class="btn" onclick="svcGo('${k}')">${b} <i style="font-style:normal">→</i></button></div></div>`).join("")}</div>
  <div class="sv-cta"><div><h3>Not sure where to start?</h3><p>Tell us what you need and our team will get back to you.</p></div><button class="btn gold" onclick="location.hash='#/solutions'">Find solutions →</button></div>
  </div>`;
};
V.learn = () => { setTimeout(learnInit, 0); return `<div class="page">${learnSec()}</div>`; };
V.blog = () => { setTimeout(() => renderNews("sap", $("#bgrid")), 0); return `<div class="page"><div class="sec-h"><p class="eyebrow">SAP Blog</p><h2>Latest SAP news &amp; insights</h2></div><p class="sec-sub">Fresh headlines on SAP S/4HANA, BTP and the wider SAP ecosystem.</p><div class="ngrid" id="bgrid"></div></div>`; };

async function route() {
  redraw = () => {};
  let h = (location.hash.slice(2) || "home").split("?")[0];
  if (!me && !["team", "contact", "blog", "solutions", "services"].includes(h)) h = "home";
  else if (h == "home") { location.hash = homeHash(); return; }
  const v = V[h] || V.home;
  if (!["team", "contact", "blog"].includes(h)) { /* landing & app views unchanged */ }
  const o = await v();
  if (typeof o == "string") { $("#app").innerHTML = o; if (h == "home") { landingFx(); renderNews("sap", $("#ngrid")); learnInit(); findInit(); } }
  window.scrollTo(0, 0);
}
async function count() {
  try {
    const n = (await getDocs(query(collection(db, "jobs"), limit(500)))).size;
    let i = 0;
    const t = setInterval(() => { $("#n2").textContent = i; if (i++ >= n) clearInterval(t); }, 40);
  } catch {}
}
window.route = route;
window.addEventListener("hashchange", route);
window.$ = $;

/* ---------- email verification ---------- */
const ver = () => { if (me && me.emailVerified) return true; toast("Please verify your email first"); return false; };
const gateHtml = () => `${pHero("Almost there", "Verify your email to continue", "One quick step keeps Provynk safe for everyone.")}
  <div class="page"><div class="card"><p style="margin-top:0">We sent a verification link to <b>${esc(me?.email || "")}</b>. Open it, then press the button below. Check your spam folder if you cannot find it.${mailTip(me?.email)}</p>
  <div class="srow"><button class="btn" onclick="checkVer()">I've verified</button><button class="btn o" onclick="resendVer()">Resend email</button></div></div></div>`;
function vbar() {
  const b = $("#vbar"); if (!b) return;
  if (me && !me.emailVerified) {
    b.className = "vbar";
    b.innerHTML = `Verify your email: we sent a link to <b>${esc(me.email)}</b>. Until you verify you cannot edit, post, apply or search. <a class="lnk" onclick="resendVer()">Resend email</a> · <a class="lnk" onclick="checkVer()">I've verified</a>`;
  } else { b.className = ""; b.innerHTML = ""; }
}
window.resendVer = async () => {
  if (await sendVerif(me)) toast("Verification email sent. Check Inbox and Spam.");
};
window.checkVer = async silent => {
  if (!me) return;
  try {
    await me.reload();
    if (me.emailVerified) { await me.getIdToken(true); vbar(); toast("Email verified"); route(); }
    else if (silent !== true) toast("Not verified yet. Open the link in the email first.");
  } catch (e) { if (silent !== true) toast(authMsg(e)); }
};
window.addEventListener("focus", () => { if (me && !me.emailVerified) checkVer(true); });
/* every action that writes data requires a verified email (the security rules enforce this too) */
["upd", "post", "apply", "saveJob", "delJob", "setSt", "mkGroup", "addMember", "saveMember", "rmGMember", "rmMember", "gToggle", "gNote", "toggleSave",
 "saveGProfile", "saveGroup", "cancelInv", "acceptInv", "declineInv", "saveSec", "delSec", "saveIntro", "saveAbout", "saveSkills", "saveOrg", "cropSave", "resume"].forEach(n => {
  const f = window[n]; if (f) window[n] = (...a) => ver() ? f(...a) : undefined;
});
/* ---------- mobile menu (hamburger) ---------- */
(() => {
  const h = document.querySelector("header"), b = $("#burger");
  if (!h || !b) return;
  const set = o => { h.classList.toggle("open", o); document.documentElement.classList.toggle("menu-open", o); b.setAttribute("aria-expanded", o); b.setAttribute("aria-label", o ? "Close menu" : "Open menu"); };
  b.onclick = () => set(!h.classList.contains("open"));
  h.addEventListener("click", e => { if (e.target.closest("nav a, #auth a, #auth button")) set(false); });
  window.addEventListener("hashchange", () => set(false));
  window.addEventListener("resize", () => { if (innerWidth > 1023) set(false); });
  document.addEventListener("keydown", e => { if (e.key == "Escape") set(false); });
})();
nav(); authBox();
</script>
